name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Python tests
        run: python -m pytest -q
      - name: Key Guard pattern tests
        run: node tests/test_patterns.js

  macos:
    name: macOS (Swift + Python)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Python tests
        run: python -m pytest -q
      - name: Swift build
        run: swift build
        working-directory: macos
      - name: Swift backend self-test
        run: PYTHONPATH="$PWD/.." "$(swift build --show-bin-path)/apikey-vault-selftest"
        working-directory: macos

  lint:
    name: Syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JS syntax
        run: |
          node --check apivault/web/app.js
          node --check apivault/web/i18n.js
          node --check extension/guard.js
          node --check extension/background.js
          node --check extension/options.js
          node --check extension/patterns.js
      - name: Shell syntax
        run: |
          bash -n script/build_and_run.sh
          bash -n scripts/build_app.sh
          bash -n scripts/package_extension.sh
      - name: Python compile
        run: python -m compileall -q apivault
