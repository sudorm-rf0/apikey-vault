name: Bug report
description: Report a problem with apikey-vault
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: dropdown
    id: surface
    attributes:
      label: Where did you see the issue?
      options:
        - CLI
        - Web GUI
        - Native macOS app
        - Browser extension (Key Guard)
        - HTTP API
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `apivault --version` or the commit hash.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `apivault init`
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
