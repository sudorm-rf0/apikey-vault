[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apikey-vault"
version = "0.6.0"
description = "Local, encrypted API-key vault for AI agents (Codex / Claude)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sudorm-rf0" }]
keywords = ["api-keys", "vault", "secrets", "encryption", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
apivault = "apivault.cli:main"

[tool.setuptools.packages.find]
include = ["apivault*"]

[tool.setuptools.package-data]
apivault = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
