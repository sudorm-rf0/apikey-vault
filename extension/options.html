<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>apikey-vault Guard — Options</title>
  <style>
    body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; color: #1d1d1f; }
    h1 { font-size: 17px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input[type=text], input[type=password] { width: 100%; padding: 7px 9px; box-sizing: border-box; border: 1px solid #c7c7cc; border-radius: 6px; }
    .hint { color: #6e6e73; font-size: 12px; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
    #status { color: #0a7d33; min-height: 18px; margin-top: 10px; }
    button { margin-top: 12px; padding: 7px 16px; border-radius: 6px; border: 1px solid #c7c7cc; background: #f5f5f7; cursor: pointer; }
    button:hover { background: #e9e9ec; }
  </style>
</head>
<body>
  <h1>apikey-vault Guard</h1>
  <p class="hint">API keys pasted or typed into any page (including AI chats) are detected and redacted to <code>{{REDACTED}}</code>.</p>

  <div class="row">
    <input type="checkbox" id="vaultEnabled">
    <label for="vaultEnabled" style="margin:0">Resolve keys against the local vault</label>
  </div>
  <p class="hint">When enabled, a redacted key is replaced with <code>{{vault:NAME}}</code> if it matches a key in your local vault (requires <code>apivault serve</code>).</p>

  <label for="vaultToken">Bearer token (optional, from <code>apivault serve --token …</code>)</label>
  <input type="password" id="vaultToken" autocomplete="off" placeholder="leave empty if the server is not token-protected">

  <div id="status"></div>
  <button id="save">Save</button>

  <script src="options.js"></script>
</body>
</html>
